# https://taskfile.dev

version: '3'

vars:
  BIN: bin/milbi
  VERSION:
    sh: git describe --tags --always --dirty
  COMMIT:
    sh: git rev-parse --short HEAD
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  build:
    desc: build the binary into bin/milbi
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/milbi
      - ./{{.BIN}} version

  test:
    desc: unit tests with coverage per package; fails below 85% (cmd/milbi excluded)
    cmds:
      - sh scripts/covergate.sh

  test:e2e:
    desc: end-to-end scenarios in e2e/testdata, built milbi against real restic and rsync (skipped when missing)
    cmds:
      - go test -tags e2e -count=1 ./e2e/...

  lint:
    desc: gofmt and go vet
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...

  lint:ci:
    desc: golangci-lint, same version as the CI lint job (compiled on first use)
    cmds:
      # keep in sync with .github/workflows/ci.yaml
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy
