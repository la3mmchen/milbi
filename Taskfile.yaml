# https://taskfile.dev

version: '3'

vars:
  BIN: bin/milbi
  VERSION:
    sh: git describe --tags --always --dirty
  COMMIT:
    sh: git rev-parse --short HEAD
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  build:
    desc: build the binary into bin/milbi
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/milbi
      - ./{{.BIN}} version

  test:
    desc: unit tests
    cmds:
      - go test -cover ./...

  test:integration:
    desc: CLI tests against fake restic/rsync (arrives with spec 03)
    cmds:
      - go test -tags integration ./...

  lint:
    desc: gofmt and go vet
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...

  lint:ci:
    desc: golangci-lint, same as the CI lint job (compiled on first use)
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy
